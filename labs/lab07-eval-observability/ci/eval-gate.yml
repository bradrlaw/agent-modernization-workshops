# ─────────────────────────────────────────────────────────────────────────────
# Lab 07 — Evaluation quality gate (REFERENCE workflow)
#
# Copy this file to .github/workflows/ to wire the offline quality gate into CI.
# Both jobs run WITHOUT Azure credentials: they score a committed, deterministic
# sample (data/responses.sample.jsonl) with the rule-based custom evaluators and
# fail the build on any violation. Add the online (LLM-judge) evaluators as a
# nightly job with federated credentials once you are ready — see README.
#
# To gate on freshly generated answers instead of the sample, add a prior step
# that runs generate_responses.py / "BankingEval.Console --task generate" with
# OIDC auth and point --data at data/responses.jsonl.
# ─────────────────────────────────────────────────────────────────────────────
name: Eval Gate

on:
  pull_request:
    paths:
      - "labs/lab07-eval-observability/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-eval-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab07-eval-observability
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The offline gate only needs the standard library + python-dotenv; pytest
      # drives the evaluator unit tests. (requirements.txt adds the heavier
      # azure-ai-evaluation stack used by the online gate.)
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest python-dotenv

      - name: Unit test custom evaluators
        run: python -m pytest tests/ -v

      - name: Offline quality gate
        run: python src/evaluate_agent.py --data data/responses.sample.jsonl

  dotnet-eval-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab07-eval-observability/src-dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BankingEval.slnx

      - name: Unit test custom evaluators
        run: dotnet test BankingEval.slnx --no-restore

      - name: Offline quality gate
        run: dotnet run --project BankingEval.Console --no-restore -- --task evaluate --data ../data/responses.sample.jsonl
